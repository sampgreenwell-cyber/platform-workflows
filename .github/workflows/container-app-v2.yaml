# Shared pipeline: build the repo's Dockerfile, push to GHCR, deploy with the repo's infra/
# Terraform (sampgreenwell-cyber/terraform-modules container-app-service). Used by repos from
# the .NET template:
#
#   permissions:
#     contents: read
#     packages: write
#     id-token: write
#   jobs:
#     deploy:
#       uses: sampgreenwell-cyber/platform-workflows/.github/workflows/container-app-v2.yaml@v1
#
# Inside a called workflow, github.* is the calling repo: checkout, the repo name (service name
# and state key) and infra/ all come from the service.
#
# v2 (this file): no repo secrets. Each job logs in to Vault with the job's GitHub OIDC token (jwt/
# role platform-pipeline, which only trusts this file and destroy-container-app-v2.yaml at
# refs/tags/v1) and reads the pipeline settings from kv/platform/pipeline. The deploy job's Azure
# credential is a fresh one per run from Vault's Azure secrets engine (azure/creds/pipeline), which
# the job revokes when it ends. The caller sets one repo variable, VAULT_ADDR, and its
# infra/ must accept a vault_addr variable (passed to the app for runtime secrets).
#
# container-app.yaml is the v1 pipeline (repo secrets from set-platform-secrets.ps1,
# secrets: inherit). Both ship on the v1 tag; see README > Versioning.

name: Container App (Terraform, Vault)

on:
  workflow_call: {}

jobs:
  build-and-push:
    name: Build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Check repo variables
        env:
          VAULT_ADDR: ${{ vars.VAULT_ADDR }}
        run: |
          if [ -z "$VAULT_ADDR" ]; then echo "::error::Repo variable VAULT_ADDR is not set. Set it with: gh variable set VAULT_ADDR --repo $GITHUB_REPOSITORY --body https://<vault fqdn>"; exit 1; fi

      - name: Read pipeline secrets from Vault
        # Pinned to the v4.0.0 commit.
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc
        with:
          url: ${{ vars.VAULT_ADDR }}
          method: jwt
          path: jwt
          role: platform-pipeline
          jwtGithubAudience: vault
          secrets: |
            kv/data/platform/pipeline GHCR_PAT | GHCR_PAT

      - uses: actions/checkout@v4

      - name: Image name
        id: image
        # GHCR image names must be lowercase.
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        run: echo "$GHCR_PAT" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build and push
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

  deploy:
    name: Terraform apply
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Read pipeline secrets from Vault
        # Pinned to the v4.0.0 commit.
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc
        with:
          url: ${{ vars.VAULT_ADDR }}
          method: jwt
          path: jwt
          role: platform-pipeline
          jwtGithubAudience: vault
          # The revoke step at the end needs the token (VAULT_TOKEN, masked).
          exportToken: true
          secrets: |
            azure/creds/pipeline client_id | ARM_CLIENT_ID ;
            azure/creds/pipeline client_secret | ARM_CLIENT_SECRET ;
            kv/data/platform/pipeline AZURE_TENANT_ID | ARM_TENANT_ID ;
            kv/data/platform/pipeline AZURE_SUBSCRIPTION_ID | ARM_SUBSCRIPTION_ID ;
            kv/data/platform/pipeline TFSTATE_RG | TFSTATE_RG ;
            kv/data/platform/pipeline TFSTATE_SA | TFSTATE_SA ;
            kv/data/platform/pipeline TFSTATE_CONTAINER | TFSTATE_CONTAINER ;
            kv/data/platform/pipeline SHARED_CAE_ID | SHARED_CAE_ID ;
            kv/data/platform/pipeline GHCR_PAT | GHCR_PAT

      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      # A new password reaches Entra ID's servers one by one, so one accepted login isn't proof:
      # wait for 3 in a row (5 s apart, up to 3 minutes). Each is a token request like Terraform's
      # next one; the secret goes to curl on stdin. CRED_ISSUED_AT is for the revoke step.
      - name: Wait for the Azure credential
        run: |
          echo "CRED_ISSUED_AT=$(date +%s)" >> "$GITHUB_ENV"
          ok=0
          for i in $(seq 1 36); do
            if printf '%s' "$ARM_CLIENT_SECRET" | curl -sf -o /dev/null \
                 --data-urlencode client_secret@- \
                 -d grant_type=client_credentials -d "client_id=$ARM_CLIENT_ID" \
                 -d scope=https://management.azure.com/.default \
                 "https://login.microsoftonline.com/$ARM_TENANT_ID/oauth2/v2.0/token"; then
              ok=$((ok + 1))
              if [ "$ok" -ge 3 ]; then
                echo "Azure credential accepted 3 times in a row after $(( (i - 1) * 5 ))s."
                exit 0
              fi
            else
              ok=0
            fi
            sleep 5
          done
          echo "::error::Entra ID didn't consistently accept the credential from azure/creds/pipeline within 3 minutes."
          exit 1

      - name: Terraform init
        working-directory: infra
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        # Retried: a just-issued credential can still be refused by a lagging Entra ID server.
        run: |
          for attempt in 1 2 3; do
            terraform init \
              -backend-config="resource_group_name=$TFSTATE_RG" \
              -backend-config="storage_account_name=$TFSTATE_SA" \
              -backend-config="container_name=$TFSTATE_CONTAINER" \
              -backend-config="key=$REPO_NAME.tfstate" \
              -backend-config="use_azuread_auth=true" \
              -backend-config="client_id=$ARM_CLIENT_ID" \
              -backend-config="client_secret=$ARM_CLIENT_SECRET" \
              -backend-config="tenant_id=$ARM_TENANT_ID" \
              -backend-config="subscription_id=$ARM_SUBSCRIPTION_ID" && exit 0
            echo "terraform init failed (attempt $attempt of 3)."
            [ "$attempt" -lt 3 ] && sleep 15
          done
          exit 1

      - name: Terraform apply
        working-directory: infra
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
          REPO_NAME: ${{ github.event.repository.name }}
          VAULT_ADDR: ${{ vars.VAULT_ADDR }}
        run: |
          terraform apply -auto-approve \
            -var="service_name=$REPO_NAME" \
            -var="image=$IMAGE" \
            -var="container_apps_environment_id=$SHARED_CAE_ID" \
            -var="ghcr_pat=$GHCR_PAT" \
            -var="ghcr_username=$GITHUB_ACTOR" \
            -var="vault_addr=$VAULT_ADDR"

      # Revoking the job's Vault token also revokes every lease it created, so Vault deletes this
      # run's Azure password now. If this never runs, it goes when the token expires (<= 30 min).
      - name: Revoke the Vault token
        if: always()
        env:
          VAULT_ADDR: ${{ vars.VAULT_ADDR }}
        run: |
          if [ -z "${VAULT_TOKEN:-}" ]; then echo "No Vault token to revoke."; exit 0; fi
          # Vault treats "password not found" as already deleted. Revoking a password younger than
          # about a minute can reach a Graph replica that hasn't seen it yet, leaving it behind
          # until its Entra end date (explicit_max_ttl, 2h). So let it age first.
          if [ -n "${CRED_ISSUED_AT:-}" ]; then
            age=$(( $(date +%s) - CRED_ISSUED_AT ))
            if [ "$age" -lt 60 ]; then
              echo "Credential is ${age}s old; waiting $(( 60 - age ))s before revoking."
              sleep $(( 60 - age ))
            fi
          fi
          if curl -sf -o /dev/null -X POST -H "X-Vault-Token: $VAULT_TOKEN" "$VAULT_ADDR/v1/auth/token/revoke-self"; then
            echo "Vault token and its leases revoked."
          else
            echo "::warning::Couldn't revoke the Vault token; its Azure credential is deleted when the token expires."
          fi
